name: terraform-apply

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
on:
  push:
    branches: ["staging"]
    paths:
      - "environments/staging/**"
      - "environments/staging/modules/**"
      - ".github/workflows/Apply-Live.yaml"
  workflow_dispatch:
    inputs:
      env_dir:
        description: 'Environment to apply (allowed: staging)'
        required: false
        default: 'staging'
      force_apply:
        description: 'Force Terraform plan/apply even if no tracked files changed'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

# Un solo apply por rama (no cancelar si ya está en curso)
concurrency:
  group: apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0) Detectar cambios y resolver directorio de entorno
  # ──────────────────────────────────────────────────────────────
  changes:
    name: Detect changes (Terraform/Workflow)
    runs-on: ubuntu-latest
    outputs:
      tf:  ${{ steps.filter.outputs.tf }}
      dir: ${{ steps.envdir.outputs.dir }}
      env: ${{ steps.envdir.outputs.env }}
      force: ${{ steps.force.outputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tf:
              - 'environments/**'
              - '.github/workflows/Apply-Live.yaml'

      - name: Pick environment dir (safe)
        id: envdir
        shell: bash
        run: |
          set -Eeuo pipefail
          # Default seguro
          ENV="environments/dev"

          # Si se lanzó manual con input, validarlo estrictamente
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.env_dir }}" ]]; then
            case "${{ inputs.env_dir }}" in
              staging)
                ENV="environments/staging"
                ;;
              *)
                echo "Invalid env_dir='${{ inputs.env_dir }}'. Only 'staging' is allowed in this workflow." >&2
                exit 1
                ;;
            esac
          else
            # Entorno fijo por rama (evita sobrescritura incorrecta)
            if [[ "${{ github.ref_name }}" == "staging" ]]; then
              ENV="environments/staging"
            elif [[ "${{ github.ref_name }}" == "main" ]]; then
              ENV="environments/dev"
            fi

          fi

          ENV_NAME="$(basename "$ENV")"
          echo "dir=$ENV" >> "$GITHUB_OUTPUT"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "Environment dir: $ENV ; env name: $ENV_NAME"

      - name: Detect force apply flag
        id: force
        shell: bash
        run: |
          set -euo pipefail
          FORCE=$(jq -r '.inputs.force_apply // "false"' "$GITHUB_EVENT_PATH")
          if [ "$FORCE" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "Force apply requested via workflow_dispatch input."
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

  # ──────────────────────────────────────────────────────────────
  # 1) PLAN en main (mismo código que vamos a aplicar)
  # ──────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan (main)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    env:
      TF_VAR_iap_members: ${{ toJSON(fromJSON(vars.TF_VAR_IAP_MEMBERS)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform 1.13.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:          ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Cache TF plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: tf-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: |
            tf-${{ runner.os }}-

      - name: Configure TF plugin cache
        run: |
          mkdir -p ~/.terraform.d
          echo 'plugin_cache_dir = "~/.terraform.d/plugin-cache"' > ~/.terraform.d/terraform.rc

      - name: Terraform Init (readonly lockfile)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform init -input=false -lockfile=readonly

      - name: Terraform Plan (save)
        id: planfile
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -e
          terraform plan -input=false -no-color -out=tfplan.bin
          terraform show -no-color tfplan.bin > tfplan.txt
          terraform show -json tfplan.bin > tfplan.json

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ needs.changes.outputs.dir }}/tfplan.bin
            ${{ needs.changes.outputs.dir }}/tfplan.txt
            ${{ needs.changes.outputs.dir }}/tfplan.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 2) Gate de aprobación (Environment con Required reviewers)
  # ──────────────────────────────────────────────────────────────
  approve_gate:
    name: Await approval (${{ needs.changes.outputs.env }})
    runs-on: ubuntu-latest
    needs: [changes, plan]
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    environment:
      name: ${{ needs.changes.outputs.env }}     # crea Environments (p.ej. prod/dev) con Required reviewers
      url: https://console.cloud.google.com/
    steps:
      - run: echo "Esperando aprobación del environment '${{ needs.changes.outputs.env }}'…"

  # ──────────────────────────────────────────────────────────────
  # 3) APPLY del tfplan generado en este mismo run
  # ──────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [changes, approve_gate]
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    env:
      TF_VAR_iap_members: ${{ toJSON(fromJSON(vars.TF_VAR_IAP_MEMBERS)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform 1.13.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:          ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ needs.changes.outputs.dir }}

      - name: Terraform Init (reconfigure)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform init -input=false -lockfile=readonly -reconfigure

      - name: Terraform Apply (approved plan)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform apply -input=false -lock-timeout=5m tfplan.bin

      - name: Export Terraform outputs
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform output -json > outputs.json

      - name: Read dynamic vm_zone (staging only)
        if: ${{ needs.changes.outputs.env == 'staging' }}
        id: vm_zone
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if terraform output -raw vm_zone > vm_zone.txt 2>/dev/null; then
            ZONE="$(cat vm_zone.txt)"
            echo "vm_zone=${ZONE}" >> "$GITHUB_OUTPUT"
            echo "Detected vm_zone: ${ZONE}"
          else
            echo "vm_zone=" >> "$GITHUB_OUTPUT"
            echo "No vm_zone output in this environment (expected for some stacks like global)."
            : > vm_zone.txt
          fi

      - name: Upload terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.changes.outputs.env }}
          path: ${{ needs.changes.outputs.dir }}/outputs.json
          retention-days: 3

      - name: Upload vm_zone artifact (staging only)
        if: ${{ needs.changes.outputs.env == 'staging' }}
        uses: actions/upload-artifact@v4
        with:
          name: applied-vm-zone
          path: ${{ needs.changes.outputs.dir }}/vm_zone.txt
          retention-days: 1

      - name: Summary (dynamic zone)
        shell: bash
        run: |
          {
            echo "## Terraform Apply summary"
            echo "- Environment: ${{ needs.changes.outputs.env }}"
            if [ "${{ needs.changes.outputs.env }}" = "staging" ]; then
              if [ -n "${{ steps.vm_zone.outputs.vm_zone }}" ]; then
                echo "- vm_zone (dynamic output): ${{ steps.vm_zone.outputs.vm_zone }}"
              else
                echo "- vm_zone (dynamic output): not found"
              fi
            else
              echo "- vm_zone: skipped (only staging)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────
  # 4) Publicar artefacto con el nombre del entorno
  # ──────────────────────────────────────────────────────────────
  publish-env-artifact:
    name: Publish env artifact
    runs-on: ubuntu-latest
    needs: [changes, apply]
    if: ${{ (needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true') && needs.apply.result == 'success' }}
    steps:
      - name: Save environment name
        run: echo "${{ needs.changes.outputs.env }}" > env.txt

      - name: Upload env artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-env
          path: env.txt
          retention-days: 1
