---
# yamllint disable rule:line-length
# yamllint disable rule:comments
name: terraform-apply

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
"on":
  push:
    branches: ["staging", "main"]
    paths:
      - "environments/staging/**"
      - "!environments/staging/ansible/**"
      - "environments/dev/**"
      - "!environments/dev/ansible/**"
      - ".github/workflows/Apply-Live.yaml"
  workflow_dispatch:
    inputs:
      env_dir:
        description: 'Environment to apply: auto, staging or dev'
        required: false
        default: 'auto'
      force_apply:
        description: 'Force Terraform plan/apply even if no tracked files changed'
        required: false
        default: 'false'

permissions:
  contents: read
  id-token: write

# Un solo apply por rama (no cancelar si ya está en curso)
concurrency:
  group: apply-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # 0) Detectar cambios y resolver directorio de entorno
  # ──────────────────────────────────────────────────────────────
  changes:
    name: Detect changes (Terraform/Workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 10 # 10 minutos para detectar cambios
    outputs:
      tf: ${{ steps.filter.outputs.tf }}
      dir: ${{ steps.envdir.outputs.dir }}
      env: ${{ steps.envdir.outputs.env }}
      force: ${{ steps.force.outputs.force }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tf:
              - 'environments/staging/**'
              - '!environments/staging/ansible/**'
              - 'environments/dev/**'
              - '!environments/dev/ansible/**'
              - '.github/workflows/Apply-Live.yaml'

      - name: Pick environment dir (safe)
        id: envdir
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_dir() {
            case "$1" in
              staging)
                echo "environments/staging"
                ;;
              dev)
                echo "environments/dev"
                ;;
              *)
                echo "Unsupported environment '$1'" >&2
                exit 1
                ;;
            esac
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_ENV="${{ inputs.env_dir }}"
            BRANCH="${{ github.ref_name }}"

            if [[ -z "$INPUT_ENV" || "$INPUT_ENV" == "auto" ]]; then
              case "$BRANCH" in
                staging)
                  ENV_NAME="staging"
                  ;;
                main)
                  ENV_NAME="dev"
                  ;;
                *)
                  echo "Unable to auto-detect environment from branch '$BRANCH'. Use env_dir=staging or env_dir=dev." >&2
                  exit 1
                  ;;
              esac
            else
              case "$INPUT_ENV" in
                staging|dev)
                  ENV_NAME="$INPUT_ENV"
                  ;;
                *)
                  echo "Invalid env_dir='$INPUT_ENV'. Allowed: auto, staging, dev." >&2
                  exit 1
                  ;;
              esac
            fi
          else
            case "${{ github.ref_name }}" in
              staging)
                ENV_NAME="staging"
                ;;
              main)
                ENV_NAME="dev"
                ;;
              *)
                echo "Unable to auto-detect environment from branch '${{ github.ref_name }}'." >&2
                exit 1
                ;;
            esac
          fi

          ENV="$(resolve_dir "$ENV_NAME")"
          if [[ ! -d "$ENV" ]]; then
            echo "Environment directory does not exist: $ENV" >&2
            exit 1
          fi

          echo "dir=$ENV" >> "$GITHUB_OUTPUT"
          echo "env=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "Environment dir: $ENV ; env name: $ENV_NAME"

      - name: Detect force apply flag
        id: force
        shell: bash
        run: |
          set -euo pipefail
          FORCE=$(jq -r '.inputs.force_apply // "false"' "$GITHUB_EVENT_PATH")
          if [ "$FORCE" = "true" ]; then
            echo "force=true" >> "$GITHUB_OUTPUT"
            echo "Force apply requested via workflow_dispatch input."
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi


  # ---------------------------------------------------------------
  # 0) Paso Previo, reforzar seguridad y deteccion de vulnerabilidades
  # ---------------------------------------------------------------
  security_checks:
    name: Security checks (TFlint/Checkov/Trivy/OPA)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    environment: ${{ needs.changes.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_INFRA_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Terraform 1.13.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Terraform Init (readonly lockfile)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform init -input=false -lockfile=readonly

      - name: Setup TFlint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init + lint
        working-directory: ${{ needs.changes.outputs.dir }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init
          tflint -f compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ needs.changes.outputs.dir }}
          framework: terraform
          external_checks_dirs: ${{ needs.changes.outputs.dir }}/checkov/terraform
          skip_check: CKV_GCP_38

      - name: Install Trivy
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version

      - name: Trivy IaC scan (dev + apply workflow)
        run: |
          set -euo pipefail

          TARGET_DIR="${GITHUB_WORKSPACE}/${{ needs.changes.outputs.dir }}"
          WORKFLOW_FILE="${GITHUB_WORKSPACE}/.github/workflows/Apply-Live.yaml"

          if [ ! -f "${WORKFLOW_FILE}" ]; then
            echo "Workflow file not found: ${WORKFLOW_FILE}" >&2
            exit 1
          fi

          trivy config --exit-code 1 --severity HIGH,CRITICAL "${TARGET_DIR}"
          trivy config --exit-code 1 --severity HIGH,CRITICAL "${WORKFLOW_FILE}"

      - name: Trivy FS scan (env only)
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL "${{ needs.changes.outputs.dir }}"

  # ──────────────────────────────────────────────────────────────
  # 1) PLAN en main (mismo código que vamos a aplicar)
  # ──────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan (main)
    runs-on: ubuntu-latest
    needs: [changes, security_checks]
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    environment: ${{ needs.changes.outputs.env }}
    timeout-minutes: 30 # 30 minutos para hacer el plan
    env:
      TF_VAR_iap_members: ${{ vars.TF_VAR_IAP_MEMBERS || '[]' }}
      TF_VAR_vm_service_account: ${{ vars.GCP_VM_SERVICE_ACCOUNT }}
      TF_VAR_environment: ${{ needs.changes.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform 1.13.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_INFRA_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Terraform Init (readonly lockfile)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform init -input=false -lockfile=readonly

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint init + lint
        working-directory: ${{ needs.changes.outputs.dir }}
        run: |
          tflint --init
          tflint -f compact

      - name: Debug Terraform inputs (machine type)
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          echo "--- var.machine_type ---"
          terraform console <<< 'var.machine_type'

      - name: Terraform Plan (save)
        id: planfile
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -e
          terraform plan -input=false -no-color -out=tfplan.bin
          terraform show -no-color tfplan.bin > tfplan.txt
          terraform show -json tfplan.bin > tfplan.json

      - name: Install Conftest
        run: |
          CONFTEST_VERSION=0.68.2
          curl -sSL -o conftest.tar.gz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
          conftest --version

      - name: OPA policy check
        working-directory: ${{ needs.changes.outputs.dir }}
        run: |
          conftest test tfplan.json -p policy/terraform-policy


      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            ${{ needs.changes.outputs.dir }}/tfplan.bin
            ${{ needs.changes.outputs.dir }}/tfplan.txt
            ${{ needs.changes.outputs.dir }}/tfplan.json
          retention-days: 7

  # ──────────────────────────────────────────────────────────────
  # 2) Gate de aprobación (Environment con Required reviewers)
  # ──────────────────────────────────────────────────────────────
  approve_gate:
    name: Await approval (${{ needs.changes.outputs.env }})
    timeout-minutes: 1440 # 24H antes de que expire
    runs-on: ubuntu-latest
    needs: [changes, plan]
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    environment:
      name: ${{ needs.changes.outputs.env }}-reviewers
      url: https://console.cloud.google.com/
    steps:
      - run: echo "Esperando aprobación del environment '${{ needs.changes.outputs.env }}'…"

  # ──────────────────────────────────────────────────────────────
  # 3) APPLY del tfplan generado en este mismo run
  # ──────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    concurrency:
      group: apply-env-${{ needs.changes.outputs.env }}
      cancel-in-progress: false
    needs: [changes, approve_gate]
    if: needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true'
    environment: ${{ needs.changes.outputs.env }}
    timeout-minutes: 45 # 45 minutos para hacer el Apply
    env:
      TF_VAR_iap_members: ${{ vars.TF_VAR_IAP_MEMBERS || '[]' }}
      TF_VAR_vm_service_account: ${{ vars.GCP_VM_SERVICE_ACCOUNT }}
      TF_VAR_environment: ${{ needs.changes.outputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform 1.13.5
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.5"
          terraform_wrapper: false

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_INFRA_PROJECT_ID }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ needs.changes.outputs.dir }}

      - name: Terraform Init (readonly lockfile)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform init -input=false -lockfile=readonly

      - name: Debug tfplan machine type (before apply)
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          echo "--- machine_type from tfplan.bin ---"
          terraform show -no-color tfplan.bin | grep -E 'machine_type|name\\s*=\\s*"' -n || true

      - name: Terraform Apply (approved plan)
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform apply -input=false -lock-timeout=5m tfplan.bin

      - name: Export Terraform outputs
        working-directory: ${{ needs.changes.outputs.dir }}
        run: terraform output -json > outputs.json

      - name: Read dynamic vm_zone
        id: vm_zone
        working-directory: ${{ needs.changes.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if terraform output -raw vm_zone > vm_zone.txt 2>/dev/null; then
            ZONE="$(cat vm_zone.txt)"
            echo "vm_zone=${ZONE}" >> "$GITHUB_OUTPUT"
            echo "Detected vm_zone: ${ZONE}"
          else
            echo "vm_zone=" >> "$GITHUB_OUTPUT"
            echo "No vm_zone output in this environment (expected for some stacks like global)."
            : > vm_zone.txt
          fi

      - name: Upload terraform outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs-${{ needs.changes.outputs.env }}
          path: ${{ needs.changes.outputs.dir }}/outputs.json
          retention-days: 3

      - name: Upload vm_zone artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-vm-zone
          path: ${{ needs.changes.outputs.dir }}/vm_zone.txt
          retention-days: 1

      - name: Summary (dynamic zone)
        shell: bash
        run: |
          {
            echo "## Terraform Apply summary"
            if [ -n "${{ steps.vm_zone.outputs.vm_zone }}" ]; then
              echo "- vm_zone (dynamic output): ${{ steps.vm_zone.outputs.vm_zone }}"
            else
              echo "- vm_zone (dynamic output): not found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────────────────────
  # 4) Publicar artefacto con el nombre del entorno
  # ──────────────────────────────────────────────────────────────
  publish-env-artifact:
    name: Publish env artifact
    runs-on: ubuntu-latest
    needs: [changes, apply]
    if: ${{ (needs.changes.outputs.tf == 'true' || needs.changes.outputs.force == 'true') && needs.apply.result == 'success' }}
    timeout-minutes: 10 # 10 Minutos para publicar el artefacto
    steps:
      - name: Save environment name
        run: echo "${{ needs.changes.outputs.env }}" > env.txt

      - name: Upload env artifact
        uses: actions/upload-artifact@v4
        with:
          name: applied-env
          path: env.txt
          retention-days: 1
