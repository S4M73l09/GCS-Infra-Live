---
- name: Scan images with Trivy
  hosts: gce
  become: true
  gather_facts: true

  tasks:
    - name: Make sure Trivy is installed
      ansible.builtin.shell: |
        set -euo pipefail
        apt-get update
        apt-get install -y wget gnupg lsb-release
        wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | gpg --dearmor \
          | tee /usr/share/keyrings/trivy.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
          | tee /etc/apt/sources.list.d/trivy.list
        apt-get update
        apt-get install -y trivy
        trivy --version
      args:
        executable: /bin/bash
        creates: /usr/bin/trivy
      changed_when: false

    - name: Get images of the container
      ansible.builtin.command: docker ps --format '{% raw %}{{.Image}}{% endraw %}'
      register: running_images
      changed_when: false

    - name: Create folder for Trivy reports
      ansible.builtin.file:
        path: "/tmp/trivy-reports/{{ ansible_date_time.date }}"
        state: directory
        mode: "0755"

    - name: Generate complete reports Trivy (HIGH,CRITICAL)
      ansible.builtin.command: >
        trivy image --format table --severity HIGH,CRITICAL --timeout 10m
        --output /tmp/trivy-reports/{{ ansible_date_time.date }}/{{ item | regex_replace('[/:]', '_') }}.txt
        {{ item }}
      loop: "{{ running_images.stdout_lines | unique }}"
      when: running_images.stdout_lines | length > 0
      register: running_images_scan
      failed_when: false
      changed_when: false

    - name: Show resume the trivy for each Images
      ansible.builtin.debug:
        msg: |
          Image: {{ item.item }}
          Exit code: {{ item.rc }}
          Report: /tmp/trivy-reports/{{ ansible_date_time.date }}/{{ item.item | regex_replace('[/:]', '_') }}.txt
      loop: "{{ running_images_scan.results | default([]) }}"
      when:
        - running_images_scan is defined
        - item.rc is defined

    - name: Download reports Trivy to the runner
      ansible.builtin.fetch:
        src: "/tmp/trivy-reports/{{ ansible_date_time.date }}/{{ item.item | regex_replace('[/:]', '_') }}.txt"
        dest: "{{ playbook_dir }}/../../../ansible-runtime/trivy-reports/{{ ansible_date_time.date }}/"
        flat: true
      loop: "{{ running_images_scan.results | default([]) }}"
      when:
        - running_images_scan is defined
        - item.item is defined
